name: Deploy Infra (Ollama)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

# Same group as deploy-dev/deploy-prod. This workflow runs git on SPIRALA_APP_DIR
# (the dev clone), so a push touching both infra/** and backend/** must NOT run
# this in parallel with deploy-dev — that parallelism is what produced the .git
# index.lock / ref-lock errors.
concurrency:
  group: spirala-server-deploy
  cancel-in-progress: false

jobs:
  deploy-ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.SPIRALA_APP_DIR }}
            # Self-heal: clear stale git locks left by an interrupted/killed run
            find .git -name '*.lock' -delete 2>/dev/null || true
            git remote prune origin 2>/dev/null || true
            git fetch --all --prune --force
            git checkout origin/dev -- infra/

            # Run Ollama setup (idempotent — skips model pull if already present)
            bash infra/setup-ollama.sh

            # Health check
            if curl -sf http://localhost:45020/ > /dev/null 2>&1; then
              echo "Ollama healthy"
            else
              echo "WARNING: Ollama health check failed"
              exit 1
            fi
