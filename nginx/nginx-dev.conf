worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Bot detection — mirrors nginx-prod.conf so OG/prerender behavior can
    # be verified on dev.spira-la.com before it reaches production.
    map $http_user_agent $is_social_crawler {
        default 0;
        # Search-engine crawlers — routed to /prerender/* backend endpoints
        ~*Googlebot        1;
        ~*bingbot          1;
        ~*AhrefsBot        1;
        ~*Semrushbot       1;
        ~*DuckDuckBot      1;
        ~*YandexBot        1;
        # Social-media link-preview crawlers
        ~*facebookexternalhit 1;
        ~*Facebot          1;
        ~*Twitterbot       1;
        ~*LinkedInBot      1;
        ~*WhatsApp         1;
        ~*Slackbot         1;
        ~*TelegramBot      1;
        ~*Discordbot       1;
        ~*Pinterest        1;
        ~*Applebot         1;
        ~*SkypeUriPreview  1;
        ~*redditbot        1;
    }

    # Frontend: dev.spira-la.com → port 45000
    # API calls (/api/*) go directly to backend on port 45002
    server {
        listen 8081 default_server;
        server_name dev.spira-la.com;

        location /api/ {
            proxy_pass http://127.0.0.1:45002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Dynamic sitemap.xml — generated by backend, includes all published blog posts.
        # Excluded from /api prefix in backend/src/main.ts so it resolves at root.
        location = /sitemap.xml {
            proxy_pass http://127.0.0.1:45002/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # -----------------------------------------------------------------
        # SEO prerender internal handler — same pattern as nginx-prod.conf.
        # -----------------------------------------------------------------
        location /prerender/ {
            internal;
            proxy_pass http://127.0.0.1:45002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }

        location = / {
            if ($is_social_crawler) {
                rewrite ^ /prerender/home last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /o-mnie {
            if ($is_social_crawler) {
                rewrite ^ /prerender/o-mnie last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /uslugi {
            if ($is_social_crawler) {
                rewrite ^ /prerender/uslugi last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /jak-pracuje {
            if ($is_social_crawler) {
                rewrite ^ /prerender/jak-pracuje last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /kontakt {
            if ($is_social_crawler) {
                rewrite ^ /prerender/kontakt last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /blog {
            if ($is_social_crawler) {
                rewrite ^ /prerender/blog last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /mama-nastolatka {
            if ($is_social_crawler) {
                rewrite ^ /prerender/mama-nastolatka last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /matka-zona-kochanka {
            if ($is_social_crawler) {
                rewrite ^ /prerender/matka-zona-kochanka last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /tworzenie-stron {
            if ($is_social_crawler) {
                rewrite ^ /prerender/tworzenie-stron last;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Shareable resource URLs — serve OG meta tags to social crawlers
        # so Facebook / WhatsApp / LinkedIn / etc. show the cover image.
        # Real users always get the SPA. Copy this block to add more
        # shareable routes (services, packages, products, …).
        location ~ ^/blog/([^/]+)$ {
            set $share_slug $1;
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45002/api/blogs/$share_slug/og$is_args$args;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Backend API: apidev.spira-la.com → port 45002
    server {
        listen 8081;
        server_name apidev.spira-la.com;

        location / {
            proxy_pass http://127.0.0.1:45002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
