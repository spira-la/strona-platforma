worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Social-media crawler detection — used by /blog/:slug (and future
    # shareable routes) to swap the SPA for backend-rendered OG HTML.
    map $http_user_agent $is_social_crawler {
        default 0;
        ~*facebookexternalhit 1;
        ~*Facebot 1;
        ~*Twitterbot 1;
        ~*LinkedInBot 1;
        ~*WhatsApp 1;
        ~*Slackbot 1;
        ~*TelegramBot 1;
        ~*Discordbot 1;
        ~*Pinterest 1;
        ~*Applebot 1;
        ~*SkypeUriPreview 1;
        ~*redditbot 1;
    }

    # Frontend: dev.spira-la.com → port 45000
    # API calls (/api/*) go directly to backend on port 45002
    server {
        listen 8081 default_server;
        server_name dev.spira-la.com;

        location /api/ {
            proxy_pass http://127.0.0.1:45002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Shareable resource URLs — serve OG meta tags to social crawlers
        # so Facebook / WhatsApp / LinkedIn / etc. show the cover image.
        # Real users always get the SPA. Copy this block to add more
        # shareable routes (services, packages, products, …).
        location ~ ^/blog/([^/]+)$ {
            set $share_slug $1;
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45002/api/blogs/$share_slug/og$is_args$args;
            }
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://127.0.0.1:45000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Backend API: apidev.spira-la.com → port 45002
    server {
        listen 8081;
        server_name apidev.spira-la.com;

        location / {
            proxy_pass http://127.0.0.1:45002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
