# =====================================================================
# Spirala — Production tunnel router nginx (port 8080)
# Cloudflare Tunnel routes external traffic to this nginx,
# which proxies to the correct Docker containers on localhost.
# =====================================================================

# Allow large file uploads (CMS images)
client_max_body_size 20m;

# ---------------------------------------------------------------------
# Social-media crawler detection — used by /blog/:slug (and future
# shareable routes) to swap the SPA for backend-rendered OG HTML.
# ---------------------------------------------------------------------
map $http_user_agent $is_social_crawler {
    default 0;
    # Search-engine crawlers — need full semantic HTML for indexing
    ~*Googlebot 1;
    ~*bingbot 1;
    ~*AhrefsBot 1;
    ~*Semrushbot 1;
    ~*DuckDuckBot 1;
    ~*YandexBot 1;
    # Social-media link-preview crawlers — need OG meta tags
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*LinkedInBot 1;
    ~*WhatsApp 1;
    ~*Slackbot 1;
    ~*TelegramBot 1;
    ~*Discordbot 1;
    ~*Pinterest 1;
    ~*Applebot 1;
    ~*SkypeUriPreview 1;
    ~*redditbot 1;
}

# Frontend: spira-la.com / www.spira-la.com → port 45001
# API calls (/api/*) go directly to the backend on port 45003
server {
    listen 8080 default_server;
    server_name spira-la.com www.spira-la.com;

    # API requests → backend
    location /api/ {
        proxy_pass http://127.0.0.1:45003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20m;
    }

    # Dynamic sitemap.xml — generated by backend, includes all published blog posts.
    # Excluded from /api prefix in backend/src/main.ts so it resolves at root.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:45003/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # -----------------------------------------------------------------
    # SEO prerender internal handler.
    #
    # nginx does NOT allow proxy_pass with a URI path inside an `if`
    # block. The workaround: use `rewrite ^ /prerender/<page> last`
    # inside the if, then catch /prerender/ here and proxy to the
    # backend. `internal` means this location is NOT reachable directly
    # from the internet — only via the internal rewrites below.
    # -----------------------------------------------------------------
    location /prerender/ {
        internal;
        proxy_pass http://127.0.0.1:45003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Home page — crawlers rewritten to /prerender/home → backend
    location = / {
        if ($is_social_crawler) {
            rewrite ^ /prerender/home last;
        }
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /o-mnie
    location = /o-mnie {
        if ($is_social_crawler) {
            rewrite ^ /prerender/o-mnie last;
        }
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /uslugi
    location = /uslugi {
        if ($is_social_crawler) {
            rewrite ^ /prerender/uslugi last;
        }
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /jak-pracuje
    location = /jak-pracuje {
        if ($is_social_crawler) {
            rewrite ^ /prerender/jak-pracuje last;
        }
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /kontakt
    location = /kontakt {
        if ($is_social_crawler) {
            rewrite ^ /prerender/kontakt last;
        }
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /blog (listing page only — individual posts handled separately below)
    location = /blog {
        if ($is_social_crawler) {
            rewrite ^ /prerender/blog last;
        }
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # -----------------------------------------------------------------
    # Shareable resource URLs — serve OG meta tags to social crawlers
    # so Facebook / WhatsApp / LinkedIn / etc. show the cover image.
    # Real users always get the SPA.
    #
    # To add a new shareable route, copy a block below and point it at
    # the backend's matching /og endpoint (e.g. /api/services/:slug/og).
    # -----------------------------------------------------------------

    # Blog posts: /blog/:slug → /api/blogs/:slug/og
    location ~ ^/blog/([^/]+)$ {
        set $share_slug $1;
        if ($is_social_crawler) {
            proxy_pass http://127.0.0.1:45003/api/blogs/$share_slug/og$is_args$args;
        }
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else → frontend
    location / {
        proxy_pass http://127.0.0.1:45001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Backend API: api.spira-la.com → port 45003
server {
    listen 8080;
    server_name api.spira-la.com;

    location / {
        proxy_pass http://127.0.0.1:45003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
