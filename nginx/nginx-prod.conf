worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Bot detection — search-engine crawlers get full semantic HTML (prerender);
    # social-media crawlers get OG meta HTML (blog OG pattern).
    map $http_user_agent $is_social_crawler {
        default 0;
        # Search-engine crawlers — routed to /prerender/* backend endpoints
        ~*Googlebot        1;
        ~*bingbot          1;
        ~*AhrefsBot        1;
        ~*Semrushbot       1;
        ~*DuckDuckBot      1;
        ~*YandexBot        1;
        # Social-media link-preview crawlers — routed to /api/blogs/:slug/og
        ~*facebookexternalhit 1;
        ~*Facebot          1;
        ~*Twitterbot       1;
        ~*LinkedInBot      1;
        ~*WhatsApp         1;
        ~*Slackbot         1;
        ~*TelegramBot      1;
        ~*Discordbot       1;
        ~*Pinterest        1;
        ~*Applebot         1;
        ~*SkypeUriPreview  1;
        ~*redditbot        1;
    }

    # Frontend: spira-la.com → port 45001
    # API calls (/api/*) go directly to backend on port 45003
    server {
        listen 8080 default_server;
        server_name spira-la.com www.spira-la.com;

        location /api/ {
            proxy_pass http://127.0.0.1:45003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Dynamic sitemap.xml — generated by backend, includes all published blog posts.
        # Excluded from /api prefix in backend/src/main.ts so it resolves at root.
        location = /sitemap.xml {
            proxy_pass http://127.0.0.1:45003/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # -----------------------------------------------------------------
        # SEO prerender internal handler.
        #
        # nginx does NOT allow proxy_pass with a URI path inside an `if`
        # block. The workaround: use `rewrite ^ /prerender/<page> last`
        # inside the if, then catch /prerender/ here and proxy to the
        # backend. `internal` means this location is NOT reachable directly
        # from the internet — only via the internal rewrites below.
        # -----------------------------------------------------------------
        location /prerender/ {
            internal;
            proxy_pass http://127.0.0.1:45003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Home page — crawlers rewritten to /prerender/home → backend
        location = / {
            if ($is_social_crawler) {
                rewrite ^ /prerender/home last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /o-mnie {
            if ($is_social_crawler) {
                rewrite ^ /prerender/o-mnie last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /uslugi {
            if ($is_social_crawler) {
                rewrite ^ /prerender/uslugi last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /jak-pracuje {
            if ($is_social_crawler) {
                rewrite ^ /prerender/jak-pracuje last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /kontakt {
            if ($is_social_crawler) {
                rewrite ^ /prerender/kontakt last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /blog {
            if ($is_social_crawler) {
                rewrite ^ /prerender/blog last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /mama-nastolatka {
            if ($is_social_crawler) {
                rewrite ^ /prerender/mama-nastolatka last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /matka-zona-kochanka {
            if ($is_social_crawler) {
                rewrite ^ /prerender/matka-zona-kochanka last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /tworzenie-stron {
            if ($is_social_crawler) {
                rewrite ^ /prerender/tworzenie-stron last;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # -----------------------------------------------------------------
        # Blog posts: serve OG meta HTML to social crawlers so Facebook /
        # WhatsApp / LinkedIn show the cover image in link previews.
        # Real users always get the SPA.
        # -----------------------------------------------------------------
        location ~ ^/blog/([^/]+)$ {
            set $share_slug $1;
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/api/blogs/$share_slug/og$is_args$args;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Backend API: api.spira-la.com → port 45003
    server {
        listen 8080;
        server_name api.spira-la.com;

        location / {
            proxy_pass http://127.0.0.1:45003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
