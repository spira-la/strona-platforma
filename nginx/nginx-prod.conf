worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Bot detection — search-engine crawlers get full semantic HTML (prerender);
    # social-media crawlers get OG meta HTML (existing blog OG pattern).
    map $http_user_agent $is_social_crawler {
        default 0;
        # Search-engine crawlers — served by /prerender/* backend endpoints
        ~*Googlebot 1;
        ~*bingbot 1;
        ~*AhrefsBot 1;
        ~*Semrushbot 1;
        ~*DuckDuckBot 1;
        ~*YandexBot 1;
        # Social-media link-preview crawlers — served by /api/blogs/:slug/og
        ~*facebookexternalhit 1;
        ~*Facebot 1;
        ~*Twitterbot 1;
        ~*LinkedInBot 1;
        ~*WhatsApp 1;
        ~*Slackbot 1;
        ~*TelegramBot 1;
        ~*Discordbot 1;
        ~*Pinterest 1;
        ~*Applebot 1;
        ~*SkypeUriPreview 1;
        ~*redditbot 1;
    }

    # Frontend: spira-la.com → port 45001
    # API calls (/api/*) go directly to backend on port 45003
    server {
        listen 8080 default_server;
        server_name spira-la.com www.spira-la.com;

        location /api/ {
            proxy_pass http://127.0.0.1:45003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Dynamic sitemap.xml — generated by backend, includes all published blog posts.
        # Excluded from /api prefix in backend/src/main.ts so it resolves at root.
        location = /sitemap.xml {
            proxy_pass http://127.0.0.1:45003/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # -----------------------------------------------------------------
        # SEO prerender — serve full semantic HTML to search-engine bots.
        # Real users always get the SPA (the if block is skipped for them).
        # Uses location = (exact match) for maximum nginx efficiency.
        # Pattern: if crawler → proxy to backend prerender endpoint;
        #          else → fall through to the outer proxy_pass (frontend).
        # -----------------------------------------------------------------

        location = / {
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/prerender/home;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /o-mnie {
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/prerender/o-mnie;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /uslugi {
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/prerender/uslugi;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /jak-pracuje {
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/prerender/jak-pracuje;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /kontakt {
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/prerender/kontakt;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /blog {
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/prerender/blog;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # -----------------------------------------------------------------
        # Shareable resource URLs — serve OG meta tags to social crawlers
        # so Facebook / WhatsApp / LinkedIn / etc. show the cover image.
        # Real users always get the SPA. Copy this block to add more
        # shareable routes (services, packages, products, …).
        # -----------------------------------------------------------------
        location ~ ^/blog/([^/]+)$ {
            set $share_slug $1;
            if ($is_social_crawler) {
                proxy_pass http://127.0.0.1:45003/api/blogs/$share_slug/og$is_args$args;
            }
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://127.0.0.1:45001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Backend API: api.spira-la.com → port 45003
    server {
        listen 8080;
        server_name api.spira-la.com;

        location / {
            proxy_pass http://127.0.0.1:45003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
